name: Deploy Development Expo Build

# Builds the GGFIX Partner App development client on Expo's EAS cloud servers.
# Runs automatically on a push to `development`, or manually from the Actions tab.
# Development-build-only: this workflow never builds or submits preview/production.

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: eas-build-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS Development Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Without EXPO_TOKEN the run reaches `eas build` and dies with
      # "An Expo user account is required to proceed" — check first and skip
      # cleanly instead, so a missing secret is a warning rather than a failure.
      - name: Check Expo credentials
        id: creds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=EAS build skipped::EXPO_TOKEN is not set on this repository, so there is nothing to authenticate the build with. Add it under Settings -> Secrets and variables -> Actions (create the token at expo.dev -> Account Settings -> Access Tokens), then re-run this workflow."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup EAS / Expo
        if: steps.creds.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo configuration
        if: steps.creds.outputs.present == 'true'
        run: |
          npx expo config --json > /dev/null
          node -e "JSON.parse(require('fs').readFileSync('eas.json', 'utf8')); console.log('eas.json is valid JSON')"

      # Android-only for now: this is a brand-new Expo project with no iOS
      # credentials provisioned yet, so a non-interactive --platform all/ios
      # build fails ("couldn't find any credentials suitable for internal
      # distribution"). Add ios back (platform: all) once someone runs
      # `eas credentials` once, interactively, to set up a distribution
      # certificate and provisioning profile.
      - name: Run EAS development build
        if: steps.creds.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile development \
            --non-interactive \
            --no-wait
