<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 76 76" fill="none">
  <defs>
    <!-- Soft teal glow: opacity 0.10, blur radius 7, offset (0,3). Swap flood-color for #1C3053 or #0788C9. -->
    <filter id="glow" x="0" y="0" width="76" height="76" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="3"/>
      <feFlood flood-color="#035C6C" flood-opacity="0.10"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feComposite operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 62dp circle: 3dp white ring + #FAFBFD inner tint -->
  <g filter="url(#glow)">
    <circle cx="38" cy="35" r="31" fill="#FFFFFF"/>
  </g>
  <circle cx="38" cy="35" r="28" fill="#FAFBFD"/>

  <!-- 20x20dp glyph (24-grid scaled 0.8333), centered -->
  <g transform="translate(28 25) scale(0.8333)" stroke="#17191B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cap -->
    <path d="M7 8.2a4.8 4.8 0 0 1 9.6 0"/>
    <path d="M6 8.2h12.2"/>
    <!-- face -->
    <path d="M7.6 8.6a4.2 4.2 0 0 0 8.4 0"/>
    <!-- shoulders -->
    <path d="M3.5 21c0-3.6 3.7-6.2 8.3-6.2 1.3 0 2.5.2 3.5.6"/>
    <!-- assigned check badge -->
    <circle cx="18.6" cy="18.6" r="3.9"/>
    <path d="M16.9 18.7l1.2 1.2 2.2-2.4"/>
  </g>
</svg>
